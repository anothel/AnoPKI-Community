name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  community-boundary:
    name: Community boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test Community boundary validator
        run: python scripts/test_validate_community_boundary.py
      - name: Validate Community boundary
        run: python scripts/validate-community-boundary.py

  docs-validation:
    name: Docs validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate docs
        run: python scripts/validate-docs.py
      - name: Test multi-name ACME evidence verifier
        run: python scripts/acme-smoke/test_verify_multisan.py
      - name: Test renewal evidence verifier and private runner cleanup
        run: |
          python scripts/acme-smoke/test_verify_renewal.py
          python scripts/acme-smoke/test_run_live_renewal.py
          python scripts/acme-smoke/test_run_lego_renewal.py
      - name: Test docs validator
        run: python scripts/test_validate_docs.py
      - name: Test local verification command list
        run: python scripts/test_verify_local.py
      - name: Test webhook receiver verification
        run: python scripts/test_webhook_receiver_verification.py

  service-contracts:
    name: Service contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test service contract validator
        run: python scripts/test_validate_service_contracts.py
      - name: Validate service contracts
        run: python scripts/validate-service-contracts.py

  core-cli-contracts:
    name: Core CLI contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test core CLI contract validator
        run: python scripts/test_validate_core_cli_contracts.py
      - name: Validate core CLI contracts
        run: python scripts/validate-core-cli-contracts.py

  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test version metadata validator
        run: python scripts/test_validate_version_metadata.py
      - name: Validate version metadata
        run: python scripts/validate-version-metadata.py
      - name: Test release metadata generator
        run: python scripts/test_generate_release_metadata.py
      - name: Test Go release verification runner
        run: python scripts/test_verify_go_release.py
      - name: Test release artifact validator
        run: python scripts/test_validate_release_artifacts.py
      - name: Test release SBOM validator
        run: python scripts/test_validate_release_sbom.py
      - name: Test release evidence validator
        run: python scripts/test_validate_release_evidence.py
      - name: Validate release evidence
        run: python scripts/validate-release-evidence.py

  recovery-drill:
    name: SQLite recovery drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test recovery drill
        run: python scripts/test_verify_recovery_drill.py
      - name: Run recovery drill
        run: >-
          python scripts/verify-recovery-drill.py
          --out-dir .tmp/recovery-evidence/ci
          --commit "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: anopki-recovery-verification
          path: .tmp/recovery-evidence/ci/
          if-no-files-found: error

  status-outage-drill:
    name: CRL and OCSP outage drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test status outage drill
        run: python scripts/test_verify_status_outage_drill.py
      - name: Run status outage drill
        run: >-
          python scripts/verify-status-outage-drill.py
          --out-dir .tmp/status-outage-evidence/ci
          --commit "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: anopki-status-outage-verification
          path: .tmp/status-outage-evidence/ci/
          if-no-files-found: error

  audit-replay-drill:
    name: Audit repair and dead-letter replay drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/test_verify_audit_replay_drill.py
      - run: python scripts/verify-audit-replay-drill.py --out-dir .tmp/audit-replay-evidence/ci --commit "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: anopki-audit-replay-verification
          path: .tmp/audit-replay-evidence/ci/
          if-no-files-found: error

  audit-integrity-drill:
    name: Audit hash-chain integrity drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: anopki_test
          POSTGRES_USER: anopki
          POSTGRES_PASSWORD: anopki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anopki -d anopki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/test_verify_audit_integrity_drill.py
      - run: >-
          python scripts/verify-audit-integrity-drill.py
          --require-postgres
          --out-dir .tmp/audit-integrity-evidence/ci
          --commit "${GITHUB_SHA}"
        env:
          ANOPKI_POSTGRES_TEST_DSN: postgres://anopki:anopki@localhost:5432/anopki_test?sslmode=disable
      - name: Validate safe Audit integrity evidence
        id: audit-evidence
        if: ${{ !cancelled() }}
        run: python scripts/verify-audit-integrity-drill.py --validate-evidence --out-dir .tmp/audit-integrity-evidence/ci
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.audit-evidence.outcome == 'success' }}
        with:
          name: anopki-audit-integrity-verification
          path: |
            .tmp/audit-integrity-evidence/ci/audit-integrity-verification.json
            .tmp/audit-integrity-evidence/ci/audit-integrity-verification.md
          if-no-files-found: error

  authorization-boundary-drill:
    name: Generic authorization boundary drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/test_verify_authorization_boundary.py
      - run: >-
          python scripts/verify-authorization-boundary.py
          --out-dir .tmp/authorization-boundary-evidence/ci
          --commit "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: anopki-authorization-boundary-verification
          path: .tmp/authorization-boundary-evidence/ci/
          if-no-files-found: error

  issuer-rollover-drill:
    name: Intermediate issuer rollover drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/test_verify_issuer_rollover_drill.py
      - run: python scripts/verify-issuer-rollover-drill.py --out-dir .tmp/issuer-rollover-evidence/ci --commit "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: anopki-issuer-rollover-verification
          path: .tmp/issuer-rollover-evidence/ci/
          if-no-files-found: error

  multi-node-reliability-drill:
    name: Multi-node reliability drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/test_verify_multi_node_reliability.py
      - run: python scripts/verify-multi-node-reliability.py --out-dir .tmp/multi-node-evidence/ci --commit "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: anopki-multi-node-verification
          path: .tmp/multi-node-evidence/ci/
          if-no-files-found: error

  postgres-multi-node-failover-drill:
    name: PostgreSQL multi-node failover drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: anopki_failover
          POSTGRES_USER: anopki
          POSTGRES_PASSWORD: anopki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anopki -d anopki_failover"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/test_verify_postgres_multi_node_failover.py
      - name: Run PostgreSQL multi-node failover drill
        run: >-
          python scripts/verify-postgres-multi-node-failover.py
          --out-dir .tmp/postgres-multi-node-failover-evidence/ci
          --commit "${GITHUB_SHA}"
        env:
          ANOPKI_POSTGRES_FAILOVER_DSN: postgres://anopki:anopki@localhost:5432/anopki_failover?sslmode=disable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anopki-postgres-multi-node-failover-verification
          path: .tmp/postgres-multi-node-failover-evidence/ci/
          if-no-files-found: error

  secret-baseline:
    name: Secret baseline scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test secret baseline scanner
        run: python scripts/test_security_baseline_scan.py
      - name: Scan for committed secrets
        run: python scripts/security-baseline-scan.py

  go-baseline:
    name: Go baseline (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.12", "1.26.11"]
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run Go baseline verification
        run: >-
          python ../scripts/verify-go-release.py
          --profile baseline
          --out-dir ../.tmp/go-evidence/baseline-${{ matrix.go }}
          --commit "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: anopki-go-baseline-${{ matrix.go }}
          path: .tmp/go-evidence/baseline-${{ matrix.go }}/
          if-no-files-found: error

  go-analysis:
    name: Go race and analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run Go race and analysis verification
        run: >-
          python ../scripts/verify-go-release.py
          --profile analysis
          --out-dir ../.tmp/go-evidence/analysis-1.26.11
          --commit "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anopki-go-analysis-1.26.11
          path: .tmp/go-evidence/analysis-1.26.11/
          if-no-files-found: error

  postgres-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: anopki_test
          POSTGRES_USER: anopki
          POSTGRES_PASSWORD: anopki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anopki -d anopki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
        working-directory: .
      - name: Record PostgreSQL version
        run: |
          psql --version
          PGPASSWORD=anopki psql -h localhost -U anopki -d anopki_test -Atc "SHOW server_version;"
      - run: go test -p 1 ./internal/store ./internal/httpapi -run PostgresIntegration -v
        env:
          ANOPKI_POSTGRES_TEST_DSN: postgres://anopki:anopki@localhost:5432/anopki_test?sslmode=disable

  postgres-recovery-drill:
    name: PostgreSQL 16 backup and restore drill
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: anopki_recovery_control
          POSTGRES_USER: anopki
          POSTGRES_PASSWORD: anopki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anopki -d anopki_recovery_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: python scripts/test_verify_postgres_recovery_drill.py
      - name: Run PostgreSQL recovery drill
        run: >-
          python scripts/verify-postgres-recovery-drill.py
          --out-dir .tmp/postgres-recovery-evidence/ci
          --commit "${GITHUB_SHA}"
        env:
          ANOPKI_POSTGRES_RECOVERY_DSN: postgres://anopki:anopki@localhost:5432/anopki_recovery_control?sslmode=disable
      - uses: actions/upload-artifact@v4
        with:
          name: anopki-postgres-recovery-verification
          path: .tmp/postgres-recovery-evidence/ci/
          if-no-files-found: error

  cpp-core:
    name: C++ core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev pkg-config
      - name: Record C++ toolchain
        run: |
          cmake --version
          c++ --version
          pkg-config --modversion openssl
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure

  windows-go-smoke:
    name: Windows native Go service smoke
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - name: Record native Windows Go toolchain
        run: |
          go version
          if ($LASTEXITCODE -ne 0) { throw "Go toolchain unavailable" }
          go env GOOS GOARCH
          if ($LASTEXITCODE -ne 0) { throw "Unable to record Go target" }
      - name: Execute native Windows Go package tests
        run: |
          go test -p 1 ./...
          if ($LASTEXITCODE -ne 0) { throw "Windows Go tests failed" }
      - name: Run native Windows Go vet
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Windows Go vet failed" }
      - name: Build native Windows service executable
        run: |
          New-Item -ItemType Directory -Force -Path "../.tmp" | Out-Null
          go build -o ../.tmp/anopki-service-windows.exe ./cmd/anopki-service
          if ($LASTEXITCODE -ne 0) { throw "Windows service build failed" }
          if (-not (Test-Path -LiteralPath "../.tmp/anopki-service-windows.exe" -PathType Leaf)) {
            throw "Missing native Windows service executable"
          }

  windows-cpp-smoke:
    name: Windows native C++ smoke
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Provision Windows OpenSSL development and runtime libraries
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } elseif ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { "C:\vcpkg" }
          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $vcpkg -PathType Leaf)) { throw "vcpkg.exe unavailable: $vcpkg" }
          & $vcpkg install "openssl:x64-windows" --classic
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL vcpkg installation failed" }
          $opensslRoot = Join-Path $vcpkgRoot "installed\x64-windows"
          $opensslBin = Join-Path $opensslRoot "bin"
          if (-not (Get-ChildItem -LiteralPath $opensslBin -Filter "libcrypto*.dll" -File -ErrorAction SilentlyContinue)) {
            throw "OpenSSL runtime DLL missing from $opensslBin"
          }
          "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV
          "$opensslBin" >> $env:GITHUB_PATH
          & $vcpkg list "openssl"
          if ($LASTEXITCODE -ne 0) { throw "Failed to record OpenSSL version" }
      - name: Record Windows toolchain
        run: |
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "CMake unavailable" }
          python --version
          if ($LASTEXITCODE -ne 0) { throw "Python unavailable" }
      - name: Configure native Community OpenSSL C++ runtime
        run: |
          cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 -DANOPKI_PRODUCT_PROFILE=community-openssl -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Windows CMake configure failed" }
      - name: Build native Windows core and CLI
        run: |
          cmake --build build-windows --config Debug --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Windows core build failed" }
      - name: Execute native CTest and CLI contracts
        run: |
          ctest --test-dir build-windows -C Debug --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Windows CTest failed" }

  cpp-fuzz-smoke:
    name: C++ fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake clang libssl-dev pkg-config
      - name: Record fuzz toolchain
        run: |
          cmake --version
          clang++ --version
          pkg-config --modversion openssl
      - run: cmake -S . -B build-fuzz -DANOPKI_ENABLE_FUZZING=ON -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build-fuzz --target anopki_core_csr_fuzz anopki_core_ocsp_fuzz anopki_core_crl_fuzz
      - run: timeout 30s ./build-fuzz/anopki_core_csr_fuzz -max_total_time=20
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      - run: timeout 30s ./build-fuzz/anopki_core_ocsp_fuzz -max_total_time=20
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      - run: timeout 30s ./build-fuzz/anopki_core_crl_fuzz -max_total_time=20
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1

  acme-live-lego:
    name: ACME live lego HTTP-01 smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Provision OpenSSL for throwaway local issuer
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev pkg-config openssl
      - name: Build native Community OpenSSL core
        run: |
          cmake -S . -B build-acme -DCMAKE_BUILD_TYPE=Debug -DANOPKI_PRODUCT_PROFILE=community-openssl
          cmake --build build-acme --target anopki-core --parallel 2
      - name: Install pinned real lego ACME client
        run: |
          mkdir -p .tmp/lego-bin
          GOBIN="${GITHUB_WORKSPACE}/.tmp/lego-bin" go install github.com/go-acme/lego/v4/cmd/lego@v4.35.2
          .tmp/lego-bin/lego --version
      - name: Complete local real-client HTTP-01 enrollment
        shell: pwsh
        run: |
          ./scripts/acme-smoke/run-certbot-smoke.ps1 -Client lego -LegoPath .tmp/lego-bin/lego -StartService -Run -CoreBin build-acme/anopki-core -ServiceBin .tmp/acme-live-lego/anopki-service -HTTPSProxyBin .tmp/acme-live-lego/acme-https-proxy -WorkDir .tmp/acme-live-lego -DirectoryTimeoutSec 90
          if ($LASTEXITCODE -ne 0) { throw "Real lego HTTP-01 enrollment failed" }
          $certificates = @(Get-ChildItem -LiteralPath ".tmp/acme-live-lego/lego/certificates" -Filter "*.crt" -File)
          if ($certificates.Count -lt 1) { throw "lego did not create a certificate" }
          foreach ($certificate in $certificates) {
            openssl x509 -in $certificate.FullName -noout -subject -issuer
            if ($LASTEXITCODE -ne 0) { throw "lego certificate invalid" }
          }
          Write-Host "Real lego HTTP-01 enrollment and certificate retrieval passed"

  acme-live-certbot:
    name: ACME live Certbot HTTP-01 smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision Community OpenSSL build tools
